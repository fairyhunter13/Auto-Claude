[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmad-claude"
version = "0.1.0"
description = "Autonomous BMAD Workflow Orchestration System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Hafiz", email = "hafiz@example.com" },
]
keywords = [
    "ai",
    "automation",
    "bmad",
    "claude",
    "workflow",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# Note: opencode-ai SDK is optional - bmad-claude uses HTTP API directly
# opencode = [
#     "opencode-ai>=1.0.0",
# ]

[project.scripts]
bmad-claude = "bmad_claude.cli.main:main"

[project.urls]
Homepage = "https://github.com/fairyhunter13/Auto-Claude"
Documentation = "https://github.com/fairyhunter13/Auto-Claude/tree/main/src/bmad_claude"
Repository = "https://github.com/fairyhunter13/Auto-Claude"

# Package is in bmad_claude/ subdirectory
[tool.hatch.build.targets.wheel]
packages = ["bmad_claude"]

[tool.hatch.build.targets.sdist]
include = [
    "bmad_claude/",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
