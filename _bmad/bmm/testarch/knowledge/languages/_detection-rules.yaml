# Language Detection Rules for TEA Workflows
# Version: 1.0.0
# 
# This file defines how TEA workflows detect programming languages
# and select appropriate test frameworks for polyglot projects.
#
# Priority order: Lower number = higher priority (checked first)
# More specific languages (Rust, Go) should have higher priority
# than common languages (TypeScript) that might have tooling files

detection_rules:

  # ============================================
  # RUST - Very specific, check first
  # ============================================
  - language: rust
    display_name: "Rust"
    priority: 10
    indicators:
      required:
        - type: file
          pattern: "Cargo.toml"
      optional:
        - type: glob
          pattern: "**/*.rs"
        - type: file
          pattern: "Cargo.lock"
    test_framework_default: cargo-test
    test_frameworks_available:
      - id: cargo-test
        name: "Cargo Test"
        description: "Built-in Rust test framework"
        config_file: null
        test_command: "cargo test"
        test_pattern: "**/*_test.rs"
    strategy_file: "languages/rust/_strategy.md"
    knowledge_fragments:
      - "languages/rust/cargo-test-patterns.md"
      - "languages/rust/integration-tests.md"

  # ============================================
  # GO - Very specific, check early
  # ============================================
  - language: go
    display_name: "Go"
    priority: 20
    indicators:
      required:
        - type: file
          pattern: "go.mod"
      optional:
        - type: glob
          pattern: "**/*.go"
        - type: file
          pattern: "go.sum"
    test_framework_default: go-test
    test_frameworks_available:
      - id: go-test
        name: "Go Test"
        description: "Built-in Go testing package"
        config_file: null
        test_command: "go test ./..."
        test_pattern: "**/*_test.go"
      - id: testify
        name: "Testify"
        description: "Enhanced assertions and mocking"
        config_file: null
        test_command: "go test ./..."
        test_pattern: "**/*_test.go"
        detection:
          - type: file_contains
            pattern: "go.mod"
            contains: "github.com/stretchr/testify"
    strategy_file: "languages/go/_strategy.md"
    knowledge_fragments:
      - "languages/go/go-testing-patterns.md"
      - "languages/go/table-driven-tests.md"
      - "languages/go/testify-patterns.md"

  # ============================================
  # PYTHON - Check before TypeScript (more specific indicators)
  # ============================================
  - language: python
    display_name: "Python"
    priority: 30
    indicators:
      required_any:
        - type: file
          pattern: "pyproject.toml"
        - type: file
          pattern: "setup.py"
        - type: file
          pattern: "setup.cfg"
        - type: file
          pattern: "requirements.txt"
        - type: file
          pattern: "Pipfile"
        - type: file
          pattern: "poetry.lock"
      optional:
        - type: glob
          pattern: "**/*.py"
    test_framework_default: pytest
    test_frameworks_available:
      - id: pytest
        name: "pytest"
        description: "Modern Python testing framework"
        config_file: "pytest.ini"
        alt_config_files: ["pyproject.toml", "setup.cfg", "tox.ini"]
        test_command: "pytest"
        test_pattern: "**/test_*.py"
        detection:
          - type: file_contains
            pattern: "pyproject.toml"
            contains: "pytest"
          - type: file_contains
            pattern: "requirements.txt"
            contains: "pytest"
      - id: unittest
        name: "unittest"
        description: "Python built-in testing"
        config_file: null
        test_command: "python -m unittest discover"
        test_pattern: "**/test_*.py"
      - id: playwright-python
        name: "Playwright Python"
        description: "E2E testing with Playwright"
        config_file: "pytest.ini"
        test_command: "pytest"
        test_pattern: "**/test_*.py"
        detection:
          - type: file_contains
            pattern: "requirements.txt"
            contains: "playwright"
          - type: file_contains
            pattern: "pyproject.toml"
            contains: "playwright"
    strategy_file: "languages/python/_strategy.md"
    knowledge_fragments:
      - "languages/python/pytest-patterns.md"
      - "languages/python/pytest-fixtures.md"
      - "languages/python/mocking-python.md"

  # ============================================
  # JAVA - Check before TypeScript
  # ============================================
  - language: java
    display_name: "Java"
    priority: 40
    indicators:
      required_any:
        - type: file
          pattern: "pom.xml"
        - type: file
          pattern: "build.gradle"
        - type: file
          pattern: "build.gradle.kts"
      optional:
        - type: glob
          pattern: "**/*.java"
        - type: glob
          pattern: "**/src/main/java/**"
    test_framework_default: junit5
    test_frameworks_available:
      - id: junit5
        name: "JUnit 5"
        description: "Modern Java testing framework"
        config_file: null
        test_command: "mvn test"
        alt_commands: ["gradle test", "./gradlew test"]
        test_pattern: "**/src/test/java/**/*Test.java"
      - id: junit4
        name: "JUnit 4"
        description: "Legacy Java testing framework"
        config_file: null
        test_command: "mvn test"
        test_pattern: "**/src/test/java/**/*Test.java"
      - id: testng
        name: "TestNG"
        description: "Alternative Java testing framework"
        config_file: "testng.xml"
        test_command: "mvn test"
        test_pattern: "**/src/test/java/**/*Test.java"
      - id: selenium
        name: "Selenium"
        description: "Browser E2E testing"
        config_file: null
        test_command: "mvn test -Dtest=*IT"
        test_pattern: "**/src/test/java/**/*IT.java"
    strategy_file: "languages/java/_strategy.md"
    knowledge_fragments:
      - "languages/java/junit5-patterns.md"
      - "languages/java/mockito-patterns.md"

  # ============================================
  # C# / .NET
  # ============================================
  - language: csharp
    display_name: "C#"
    priority: 50
    indicators:
      required_any:
        - type: glob
          pattern: "**/*.csproj"
        - type: glob
          pattern: "**/*.sln"
      optional:
        - type: glob
          pattern: "**/*.cs"
    test_framework_default: xunit
    test_frameworks_available:
      - id: xunit
        name: "xUnit"
        description: "Modern .NET testing framework"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Tests.cs"
      - id: nunit
        name: "NUnit"
        description: "Popular .NET testing framework"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Tests.cs"
      - id: mstest
        name: "MSTest"
        description: "Microsoft's testing framework"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Tests.cs"
    strategy_file: "languages/csharp/_strategy.md"
    knowledge_fragments:
      - "languages/csharp/xunit-patterns.md"
      - "languages/csharp/moq-patterns.md"

  # ============================================
  # SCALA - JVM/Functional, check before Java
  # ============================================
  - language: scala
    display_name: "Scala"
    priority: 32
    indicators:
      required_any:
        - type: file
          pattern: "build.sbt"
        - type: glob
          pattern: "**/*.scala"
      optional:
        - type: file
          pattern: "project/build.properties"
        - type: file
          pattern: "project/plugins.sbt"
    test_framework_default: scalatest
    test_frameworks_available:
      - id: scalatest
        name: "ScalaTest"
        description: "Flexible Scala testing framework"
        config_file: null
        test_command: "sbt test"
        test_pattern: "**/*Spec.scala"
      - id: munit
        name: "MUnit"
        description: "Lightweight Scala testing"
        config_file: null
        test_command: "sbt test"
        test_pattern: "**/*Suite.scala"
        detection:
          - type: file_contains
            pattern: "build.sbt"
            contains: "munit"
      - id: specs2
        name: "Specs2"
        description: "BDD testing for Scala"
        config_file: null
        test_command: "sbt test"
        test_pattern: "**/*Spec.scala"
    strategy_file: "languages/scala/_strategy.md"
    knowledge_fragments:
      - "languages/scala/scalatest-patterns.md"
      - "languages/scala/property-testing.md"

  # ============================================
  # KOTLIN - JVM language, check before Java
  # ============================================
  - language: kotlin
    display_name: "Kotlin"
    priority: 35
    indicators:
      required_any:
        - type: file
          pattern: "build.gradle.kts"
        - type: file_contains
          pattern: "build.gradle"
          contains: "kotlin"
        - type: glob
          pattern: "**/*.kt"
      optional:
        - type: glob
          pattern: "**/*.kts"
        - type: file
          pattern: "settings.gradle.kts"
    test_framework_default: kotest
    test_frameworks_available:
      - id: kotest
        name: "Kotest"
        description: "Kotlin-native testing framework"
        config_file: null
        test_command: "./gradlew test"
        test_pattern: "**/*Spec.kt"
        detection:
          - type: file_contains
            pattern: "build.gradle.kts"
            contains: "io.kotest"
      - id: junit5-kotlin
        name: "JUnit 5 (Kotlin)"
        description: "JUnit 5 with Kotlin"
        config_file: null
        test_command: "./gradlew test"
        test_pattern: "**/*Test.kt"
    strategy_file: "languages/kotlin/_strategy.md"
    knowledge_fragments:
      - "languages/kotlin/kotest-patterns.md"
      - "languages/kotlin/mockk-patterns.md"

  # ============================================
  # SWIFT - Apple platforms
  # ============================================
  - language: swift
    display_name: "Swift"
    priority: 45
    indicators:
      required_any:
        - type: file
          pattern: "Package.swift"
        - type: glob
          pattern: "**/*.xcodeproj"
        - type: glob
          pattern: "**/*.xcworkspace"
      optional:
        - type: glob
          pattern: "**/*.swift"
    test_framework_default: xctest
    test_frameworks_available:
      - id: xctest
        name: "XCTest"
        description: "Apple's built-in testing framework"
        config_file: null
        test_command: "swift test"
        alt_commands: ["xcodebuild test"]
        test_pattern: "**/*Tests.swift"
      - id: swift-testing
        name: "Swift Testing"
        description: "New Swift 6 testing framework"
        config_file: null
        test_command: "swift test"
        test_pattern: "**/*Tests.swift"
    strategy_file: "languages/swift/_strategy.md"
    knowledge_fragments:
      - "languages/swift/xctest-patterns.md"
      - "languages/swift/async-testing.md"

  # ============================================
  # PHP - Web development
  # ============================================
  - language: php
    display_name: "PHP"
    priority: 55
    indicators:
      required_any:
        - type: file
          pattern: "composer.json"
        - type: glob
          pattern: "**/*.php"
      optional:
        - type: file
          pattern: "composer.lock"
        - type: file
          pattern: "phpunit.xml"
        - type: file
          pattern: "phpunit.xml.dist"
    test_framework_default: phpunit
    test_frameworks_available:
      - id: phpunit
        name: "PHPUnit"
        description: "De facto PHP testing framework"
        config_file: "phpunit.xml"
        alt_config_files: ["phpunit.xml.dist"]
        test_command: "./vendor/bin/phpunit"
        test_pattern: "**/*Test.php"
      - id: pest
        name: "Pest"
        description: "Modern PHP testing framework"
        config_file: "phpunit.xml"
        test_command: "./vendor/bin/pest"
        test_pattern: "**/*Test.php"
        detection:
          - type: file_contains
            pattern: "composer.json"
            contains: "pestphp/pest"
    strategy_file: "languages/php/_strategy.md"
    knowledge_fragments:
      - "languages/php/phpunit-patterns.md"
      - "languages/php/mockery-patterns.md"

  # ============================================
  # RUBY - Scripting and web
  # ============================================
  - language: ruby
    display_name: "Ruby"
    priority: 60
    indicators:
      required_any:
        - type: file
          pattern: "Gemfile"
        - type: glob
          pattern: "**/*.rb"
      optional:
        - type: file
          pattern: "Gemfile.lock"
        - type: file
          pattern: ".rspec"
        - type: file
          pattern: "Rakefile"
    test_framework_default: rspec
    test_frameworks_available:
      - id: rspec
        name: "RSpec"
        description: "BDD testing framework for Ruby"
        config_file: ".rspec"
        test_command: "bundle exec rspec"
        test_pattern: "**/*_spec.rb"
        detection:
          - type: file_contains
            pattern: "Gemfile"
            contains: "rspec"
      - id: minitest
        name: "Minitest"
        description: "Ruby built-in testing"
        config_file: null
        test_command: "ruby -Itest test/**/*_test.rb"
        test_pattern: "**/*_test.rb"
    strategy_file: "languages/ruby/_strategy.md"
    knowledge_fragments:
      - "languages/ruby/rspec-patterns.md"
      - "languages/ruby/factory-bot-patterns.md"

  # ============================================
  # ELIXIR - Erlang VM, functional
  # ============================================
  - language: elixir
    display_name: "Elixir"
    priority: 65
    indicators:
      required_any:
        - type: file
          pattern: "mix.exs"
        - type: glob
          pattern: "**/*.ex"
      optional:
        - type: glob
          pattern: "**/*.exs"
        - type: file
          pattern: "mix.lock"
    test_framework_default: exunit
    test_frameworks_available:
      - id: exunit
        name: "ExUnit"
        description: "Built-in Elixir test framework"
        config_file: "test/test_helper.exs"
        test_command: "mix test"
        test_pattern: "**/*_test.exs"
    strategy_file: "languages/elixir/_strategy.md"
    knowledge_fragments:
      - "languages/elixir/exunit-patterns.md"
      - "languages/elixir/property-testing.md"

  # ============================================
  # CLOJURE - Lisp on JVM
  # ============================================
  - language: clojure
    display_name: "Clojure"
    priority: 70
    indicators:
      required_any:
        - type: file
          pattern: "deps.edn"
        - type: file
          pattern: "project.clj"
        - type: glob
          pattern: "**/*.clj"
      optional:
        - type: glob
          pattern: "**/*.cljs"
        - type: glob
          pattern: "**/*.cljc"
    test_framework_default: clojure-test
    test_frameworks_available:
      - id: clojure-test
        name: "clojure.test"
        description: "Built-in Clojure test framework"
        config_file: null
        test_command: "clojure -X:test"
        alt_commands: ["lein test"]
        test_pattern: "**/*_test.clj"
      - id: midje
        name: "Midje"
        description: "BDD testing for Clojure"
        config_file: null
        test_command: "lein midje"
        test_pattern: "**/*_test.clj"
        detection:
          - type: file_contains
            pattern: "project.clj"
            contains: "midje"
    strategy_file: "languages/clojure/_strategy.md"
    knowledge_fragments:
      - "languages/clojure/test-patterns.md"
      - "languages/clojure/spec-testing.md"

  # ============================================
  # HASKELL - Pure functional
  # ============================================
  - language: haskell
    display_name: "Haskell"
    priority: 72
    indicators:
      required_any:
        - type: file
          pattern: "stack.yaml"
        - type: file
          pattern: "cabal.project"
        - type: glob
          pattern: "**/*.cabal"
        - type: file
          pattern: "package.yaml"
      optional:
        - type: glob
          pattern: "**/*.hs"
        - type: glob
          pattern: "**/*.lhs"
        - type: file
          pattern: "stack.yaml.lock"
    test_framework_default: hspec
    test_frameworks_available:
      - id: hspec
        name: "HSpec"
        description: "BDD testing for Haskell"
        config_file: null
        test_command: "stack test"
        alt_commands: ["cabal test"]
        test_pattern: "**/*Spec.hs"
      - id: tasty
        name: "Tasty"
        description: "Modern testing framework"
        config_file: null
        test_command: "stack test"
        test_pattern: "**/Test*.hs"
        detection:
          - type: file_contains
            pattern: "package.yaml"
            contains: "tasty"
      - id: quickcheck
        name: "QuickCheck"
        description: "Property-based testing"
        config_file: null
        test_command: "stack test"
        test_pattern: "**/*Prop.hs"
    strategy_file: "languages/haskell/_strategy.md"
    knowledge_fragments:
      - "languages/haskell/hspec-patterns.md"
      - "languages/haskell/property-testing.md"

  # ============================================
  # OCAML - ML family, systems
  # ============================================
  - language: ocaml
    display_name: "OCaml"
    priority: 74
    indicators:
      required_any:
        - type: file
          pattern: "dune-project"
        - type: file
          pattern: "dune"
        - type: glob
          pattern: "**/*.opam"
      optional:
        - type: glob
          pattern: "**/*.ml"
        - type: glob
          pattern: "**/*.mli"
        - type: file
          pattern: "*.opam.locked"
    test_framework_default: alcotest
    test_frameworks_available:
      - id: alcotest
        name: "Alcotest"
        description: "Lightweight OCaml testing"
        config_file: null
        test_command: "dune runtest"
        test_pattern: "**/test_*.ml"
      - id: ounit2
        name: "OUnit2"
        description: "Classic OCaml unit testing"
        config_file: null
        test_command: "dune runtest"
        test_pattern: "**/*_test.ml"
      - id: qcheck
        name: "QCheck"
        description: "Property-based testing for OCaml"
        config_file: null
        test_command: "dune runtest"
        test_pattern: "**/*_prop.ml"
    strategy_file: "languages/ocaml/_strategy.md"
    knowledge_fragments:
      - "languages/ocaml/alcotest-patterns.md"
      - "languages/ocaml/qcheck-patterns.md"

  # ============================================
  # F# - Functional .NET
  # ============================================
  - language: fsharp
    display_name: "F#"
    priority: 48
    indicators:
      required_any:
        - type: glob
          pattern: "**/*.fsproj"
        - type: glob
          pattern: "**/*.fs"
      optional:
        - type: glob
          pattern: "**/*.fsx"
        - type: glob
          pattern: "**/*.fsi"
    test_framework_default: expecto
    test_frameworks_available:
      - id: expecto
        name: "Expecto"
        description: "F# native testing framework"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Tests.fs"
      - id: xunit-fsharp
        name: "xUnit (F#)"
        description: "xUnit with FsUnit"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Tests.fs"
      - id: fscheck
        name: "FsCheck"
        description: "Property-based testing"
        config_file: null
        test_command: "dotnet test"
        test_pattern: "**/*Properties.fs"
    strategy_file: "languages/fsharp/_strategy.md"
    knowledge_fragments:
      - "languages/fsharp/expecto-patterns.md"
      - "languages/fsharp/fscheck-patterns.md"

  # ============================================
  # DART - Flutter/mobile
  # ============================================
  - language: dart
    display_name: "Dart"
    priority: 76
    indicators:
      required_any:
        - type: file
          pattern: "pubspec.yaml"
        - type: glob
          pattern: "**/*.dart"
      optional:
        - type: file
          pattern: "pubspec.lock"
        - type: file
          pattern: "analysis_options.yaml"
        - type: glob
          pattern: "**/lib/**/*.dart"
    test_framework_default: dart-test
    test_frameworks_available:
      - id: dart-test
        name: "Dart Test"
        description: "Official Dart testing package"
        config_file: "dart_test.yaml"
        test_command: "dart test"
        alt_commands: ["flutter test"]
        test_pattern: "**/*_test.dart"
      - id: flutter-test
        name: "Flutter Test"
        description: "Widget and integration testing"
        config_file: null
        test_command: "flutter test"
        test_pattern: "**/*_test.dart"
        detection:
          - type: file_contains
            pattern: "pubspec.yaml"
            contains: "flutter:"
      - id: integration-test
        name: "Integration Test"
        description: "Flutter integration testing"
        config_file: null
        test_command: "flutter test integration_test"
        test_pattern: "integration_test/**/*_test.dart"
    strategy_file: "languages/dart/_strategy.md"
    knowledge_fragments:
      - "languages/dart/dart-test-patterns.md"
      - "languages/dart/widget-testing.md"

  # ============================================
  # ZIG - Systems programming
  # ============================================
  - language: zig
    display_name: "Zig"
    priority: 15
    indicators:
      required_any:
        - type: file
          pattern: "build.zig"
        - type: file
          pattern: "build.zig.zon"
        - type: glob
          pattern: "**/*.zig"
      optional:
        - type: file
          pattern: "zig.mod"
        - type: glob
          pattern: "**/src/*.zig"
    test_framework_default: zig-test
    test_frameworks_available:
      - id: zig-test
        name: "Zig Test"
        description: "Built-in Zig testing"
        config_file: null
        test_command: "zig build test"
        alt_commands: ["zig test src/main.zig"]
        test_pattern: "**/*.zig"
    strategy_file: "languages/zig/_strategy.md"
    knowledge_fragments:
      - "languages/zig/zig-test-patterns.md"
      - "languages/zig/comptime-testing.md"

  # ============================================
  # TYPESCRIPT / JAVASCRIPT - Check last (most common, tooling everywhere)
  # ============================================
  - language: typescript
    display_name: "TypeScript"
    priority: 100
    indicators:
      required_any:
        - type: file
          pattern: "tsconfig.json"
        - type: file_contains
          pattern: "package.json"
          contains: '"typescript"'
      optional:
        - type: glob
          pattern: "**/*.ts"
          exclude: "**/*.d.ts"
        - type: glob
          pattern: "**/*.tsx"
    test_framework_default: playwright
    test_frameworks_available:
      - id: playwright
        name: "Playwright"
        description: "E2E and API testing"
        config_file: "playwright.config.ts"
        alt_config_files: ["playwright.config.js"]
        test_command: "npx playwright test"
        test_pattern: "**/*.spec.ts"
        detection:
          - type: file_contains
            pattern: "package.json"
            contains: "@playwright/test"
      - id: jest
        name: "Jest"
        description: "Unit and integration testing"
        config_file: "jest.config.ts"
        alt_config_files: ["jest.config.js", "jest.config.json"]
        test_command: "npm test"
        test_pattern: "**/*.test.ts"
        detection:
          - type: file_contains
            pattern: "package.json"
            contains: '"jest"'
      - id: vitest
        name: "Vitest"
        description: "Fast unit testing for Vite projects"
        config_file: "vitest.config.ts"
        alt_config_files: ["vite.config.ts"]
        test_command: "npm test"
        test_pattern: "**/*.test.ts"
        detection:
          - type: file_contains
            pattern: "package.json"
            contains: '"vitest"'
      - id: cypress
        name: "Cypress"
        description: "E2E and component testing"
        config_file: "cypress.config.ts"
        alt_config_files: ["cypress.config.js", "cypress.json"]
        test_command: "npx cypress run"
        test_pattern: "**/*.cy.ts"
        detection:
          - type: file_contains
            pattern: "package.json"
            contains: '"cypress"'
    framework_selection_logic:
      - condition: has_playwright_config
        framework: playwright
      - condition: has_cypress_config
        framework: cypress
      - condition: has_vitest_config
        framework: vitest
      - condition: has_jest_config
        framework: jest
      - condition: has_ui_components
        framework: playwright
      - condition: pure_library
        framework: vitest
    strategy_file: "languages/typescript/_strategy.md"
    knowledge_fragments:
      - "languages/typescript/playwright-patterns.md"
      - "languages/typescript/fixtures-ts.md"
      - "languages/typescript/mocking-ts.md"

  # ============================================
  # JAVASCRIPT (non-TypeScript)
  # ============================================
  - language: javascript
    display_name: "JavaScript"
    priority: 110
    indicators:
      required:
        - type: file
          pattern: "package.json"
      required_not:
        - type: file
          pattern: "tsconfig.json"
      optional:
        - type: glob
          pattern: "**/*.js"
          exclude: "**/node_modules/**"
    test_framework_default: jest
    test_frameworks_available:
      - id: jest
        name: "Jest"
        description: "Unit and integration testing"
        config_file: "jest.config.js"
        test_command: "npm test"
        test_pattern: "**/*.test.js"
      - id: playwright
        name: "Playwright"
        description: "E2E testing"
        config_file: "playwright.config.js"
        test_command: "npx playwright test"
        test_pattern: "**/*.spec.js"
      - id: cypress
        name: "Cypress"
        description: "E2E testing"
        config_file: "cypress.config.js"
        test_command: "npx cypress run"
        test_pattern: "**/*.cy.js"
    strategy_file: "languages/typescript/_strategy.md"  # Share with TS
    knowledge_fragments:
      - "languages/typescript/playwright-patterns.md"
      - "languages/typescript/jest-patterns.md"

# ============================================
# GLOBAL CONFIGURATION
# ============================================

global_exclusions:
  # Package managers and dependencies
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/env/**"
  - "**/__pycache__/**"
  - "**/.eggs/**"
  - "**/*.egg-info/**"
  
  # Build outputs
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/out/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/.next/**"
  - "**/.nuxt/**"
  
  # Version control
  - "**/.git/**"
  - "**/.svn/**"
  - "**/.hg/**"
  
  # IDE and editor
  - "**/.idea/**"
  - "**/.vscode/**"
  - "**/*.swp"
  - "**/*.swo"
  
  # Test outputs
  - "**/coverage/**"
  - "**/test-results/**"
  - "**/playwright-report/**"
  - "**/.nyc_output/**"

# ============================================
# DETECTION SETTINGS
# ============================================

detection_settings:
  # Maximum directory depth to scan
  max_depth: 5
  
  # Stop scanning subdirectory if language already detected at parent
  inherit_parent_language: true
  
  # Allow multiple languages in same project
  allow_polyglot: true
  
  # Cache detection results
  cache_results: true
  cache_duration_minutes: 60
  
  # Minimum confidence to report a language
  min_confidence: 0.7

# ============================================
# FAMILY HINTS (for Tier 2 inference)
# ============================================

family_hints:
  # Map known languages to their families
  # Used when a similar unknown language is encountered
  
  rust:
    families: [c-family, ml-family, systems-family]
    primary: systems-family
    
  go:
    families: [c-family]
    primary: c-family
    
  typescript:
    families: [c-family]
    primary: c-family
    
  javascript:
    families: [c-family, scripting-family]
    primary: scripting-family
    
  python:
    families: [scripting-family]
    primary: scripting-family
    
  java:
    families: [c-family]
    primary: c-family
    
  csharp:
    families: [c-family]
    primary: c-family
    
  kotlin:
    families: [c-family]
    primary: c-family
    
  swift:
    families: [c-family, systems-family]
    primary: c-family
    
  php:
    families: [c-family, scripting-family]
    primary: scripting-family
    
  ruby:
    families: [scripting-family]
    primary: scripting-family
    
  scala:
    families: [c-family, ml-family]
    primary: ml-family
    
  elixir:
    families: [ml-family, scripting-family]
    primary: ml-family
    
  clojure:
    families: [lisp-family]
    primary: lisp-family
    
  haskell:
    families: [ml-family]
    primary: ml-family
    
  ocaml:
    families: [ml-family]
    primary: ml-family
    
  fsharp:
    families: [ml-family, c-family]
    primary: ml-family
    
  dart:
    families: [c-family]
    primary: c-family
    
  zig:
    families: [c-family, systems-family]
    primary: systems-family
    
  # When inferring unknown languages, use these patterns
  inference_patterns:
    c-family:
      strong_indicators:
        - pattern: "\\{[\\s\\S]*\\}"
          weight: 3
        - pattern: ";\\s*$"
          weight: 4
        - pattern: "\\b(if|else|while|for|switch)\\s*\\("
          weight: 3
      weak_indicators:
        - pattern: "//.*$"
          weight: 1
        - pattern: "/\\*[\\s\\S]*\\*/"
          weight: 1
          
    ml-family:
      strong_indicators:
        - pattern: "\\blet\\s+\\w+\\s*="
          weight: 5
        - pattern: "\\|>"
          weight: 5
        - pattern: "\\bmatch\\b"
          weight: 4
      weak_indicators:
        - pattern: "->\\s*$"
          weight: 2
        - pattern: "\\bfun\\b"
          weight: 2
          
    lisp-family:
      strong_indicators:
        - pattern: "^\\s*\\([a-z]+"
          weight: 5
        - pattern: "\\(def[n]?\\s"
          weight: 5
      weak_indicators:
        - pattern: "\\)\\)\\)+"
          weight: 3
          
    systems-family:
      strong_indicators:
        - pattern: "\\bunsafe\\b"
          weight: 5
        - pattern: "\\b(malloc|free|alloc)\\b"
          weight: 5
        - pattern: "\\b(u8|u16|u32|u64|i8|i16|i32|i64)\\b"
          weight: 4
      weak_indicators:
        - pattern: "[*&]\\w+"
          weight: 2
          
    scripting-family:
      strong_indicators:
        - pattern: "^#!"
          weight: 5
        - pattern: "\\bdef\\s+\\w+.*:"
          weight: 4
      weak_indicators:
        - pattern: "\\bprint\\b|\\bputs\\b|\\becho\\b"
          weight: 2

# ============================================
# DISCOVERY MODE SETTINGS (Tier 3)
# ============================================

discovery:
  # Whether discovery mode is enabled
  enabled: true
  
  # How discovery mode is triggered
  # auto: automatically run when language unknown
  # prompt: ask user before running
  # disabled: never run discovery
  mode: prompt
  
  # Allow web fetching for research
  allow_web_fetch: true
  
  # Timeout for discovery operations (seconds)
  timeout: 60
  
  # Search queries template for unknown languages
  search_queries:
    - "{language} testing framework"
    - "{language} unit test tutorial"
    - "{language} test best practices"
    - "{language} how to run tests"
  
  # Project analysis settings
  project_analysis:
    # Patterns to identify test files
    test_file_patterns:
      - "*test*"
      - "*spec*"
      - "test_*"
      - "*_test.*"
      - "*.test.*"
      - "*.spec.*"
    
    # Content markers indicating test files
    test_content_markers:
      - "assert"
      - "expect"
      - "test("
      - "describe("
      - "it("
      - "should"
    
    # Files to check for test commands
    test_command_locations:
      - "Makefile"
      - "package.json"
      - "*.toml"
      - "README*"
      - ".github/workflows/*"
      - ".gitlab-ci.yml"
      - "Taskfile.yml"
  
  # Where to save discovered strategies
  provisional:
    enabled: true
    path: "languages/_provisional"
    filename: "_provisional.md"

# ============================================
# UNIVERSAL FALLBACK SETTINGS (Tier 4)
# ============================================

universal_fallback:
  # When to use universal fallback
  triggers:
    - discovery_failed
    - discovery_disabled
    - user_selected
    - confidence_below: 0.3
  
  # Path to universal fallback strategy
  strategy_file: "universal/universal-fallback.md"
  
  # Prompt user when using fallback
  prompt_user: true
  
  # Default test patterns when nothing is known
  default_patterns:
    test_directories:
      - "tests"
      - "test"
      - "spec"
      - "__tests__"
    test_file_patterns:
      - "*test*"
      - "*spec*"
    test_commands:
      - "make test"
      - "./test.sh"
      - "npm test"

# ============================================
# COMPONENT DETECTION
# ============================================

component_patterns:
  # Monorepo patterns
  monorepo_indicators:
    - pattern: "apps/*"
      type: "application"
    - pattern: "packages/*"
      type: "library"
    - pattern: "services/*"
      type: "service"
    - pattern: "libs/*"
      type: "library"
  
  # Each subdirectory with a language indicator is a component
  component_root_files:
    - "package.json"
    - "go.mod"
    - "Cargo.toml"
    - "pyproject.toml"
    - "pom.xml"
    - "*.csproj"
